# Upozornění do mobilu i se zavřeným ATLASem (scripts/watch.mjs, notifikace přes aplikaci ntfy):
#  - 2× denně kontrola, jestli ATLAS hledá, a hlídané ceny z tajného ATLAS_WATCH (kód z tlačítka „📲 Hlídat
#    i v mobilu“ u Hlídaných cen v aplikaci)
#  - ve čtvrtek ráno tip na nejlevnější víkendy z „Odkud obvykle létáš“
# Tajné údaje: repozitář → Settings → Secrets and variables → Actions → New repository secret:
#   NTFY_TOPIC  název tématu, ke kterému se přihlásíš v aplikaci ntfy (bez něj se zprávy jen vypíšou do logu)
#   ATLAS_WATCH kód z aplikace (po změně hlídaných hledání ho vlož znovu)
# Časy jsou v UTC: 5:17 a 15:17 = 7:17 a 17:17 letního času (6:17 a 16:17 zimního), tip ve čtvrtek v 6:23 UTC.
# GitHub plánované běhy u veřejného repozitáře vypne po 60 dnech bez commitu – zapnou se v záložce Actions.
name: Upozornění do mobilu

on:
  schedule:
    - cron: '17 5,15 * * *'
    - cron: '23 6 * * 4'
  workflow_dispatch:
    inputs:
      mode:
        description: Co spustit
        type: choice
        options: ['health alerts', 'alerts', 'tips', 'health', 'health alerts tips']
        default: 'health alerts'

permissions:
  contents: read

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stav z minula (co už bylo hlášeno)
        uses: actions/cache/restore@v4
        with:
          path: .watch-state.json
          key: watch-state-${{ github.run_id }}
          restore-keys: watch-state-
      - name: Kontrola
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ATLAS_WATCH: ${{ secrets.ATLAS_WATCH }}
          MODES: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '23 6 * * 4' && 'tips' || 'health alerts') }}
        run: node scripts/watch.mjs $MODES
      - name: Uložit stav
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .watch-state.json
          key: watch-state-${{ github.run_id }}
