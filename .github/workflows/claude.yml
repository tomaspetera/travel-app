# @claude na GitHubu: když v issue (třeba „na mobilu se špatně zobrazuje …“) nebo v komentáři k issue / PR napíšeš
# @claude, Claude chybu dohledá, opraví, spustí testy a pošle větev s odkazem na vytvoření PR. Platí se z API kreditu
# (tajný údaj ANTHROPIC_API_KEY: repozitář → Settings → Secrets and variables → Actions → New repository secret).
# Spustit ho může jen ten, kdo má do repozitáře právo zápisu – cizí @claude v komentáři nic nestojí.
name: Claude (@claude)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

# jeden běh na issue / PR najednou (další @claude počká, nic se neplatí dvakrát)
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_KEY == 'true' # bez klíče se nic nespustí (běh skončí zeleně)
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm test),Bash(node --test:*),Bash(git status),Bash(git diff:*),Bash(git log:*),WebFetch(domain:atlas-letenky.onrender.com)"
